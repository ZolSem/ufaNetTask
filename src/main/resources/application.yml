spring:
  application:
    name: ufaNetTask
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      file: ./docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.springframework.boot.docker.compose: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

queue:
  name:
    invoice: invoice