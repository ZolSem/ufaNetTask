spring:
  application:
    name: ufaNetTask
  cache:
    type: caffeine
    cache-names: users, userInfo
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m,expireAfterAccess=5m
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop
      file: ./docker-compose.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: localhost
      port: 6379
app:
  cache:
    local:
      enabled: true
      max-size: 1000
      expire-after-write: 10m
      expire-after-access: 5m

logging:
  level:
    org.springframework.boot.docker.compose: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

queue:
  name:
    invoice: invoice